server {
    listen 80;
    server_name _;
        listen [::]:80;          # 让容器同时监听 IPv6，绕开 docker-proxy
    server_name _;

    sendfile off;            # 整个 server 关 sendfile，overlay2 不再 4 KB 卡顿
    tcp_nopush on;           # 顺便把小块包攒一起发
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
        location /static/ {
        root /front;      # 确保文件在 /front/static/...
    }

        # 静态前端
    location / {
        root   /front;          # 与 docker-compose 里挂载的 /front 对应
        index  index.html;
        try_files $uri $uri/ /index.html;   # 支持 React Router 的 browserHistory
    }
}
